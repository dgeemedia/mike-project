  <style>
    /* ── Post-specific styles ── */
    .post-hero {
      position: relative;
      height: 420px;
      overflow: hidden;
      background: var(--primary);
    }
    .post-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.55;
    }
    .post-hero-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      padding-bottom: 48px;
    }
    .post-hero-overlay .container {
      width: 100%;
    }
    .post-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .post-body {
      max-width: 760px;
      margin: 0 auto;
      color: var(--grey);
      line-height: 1.9;
      font-size: 16px;
    }
    .post-body h1,
    .post-body h2,
    .post-body h3,
    .post-body h4 {
      color: var(--text);
      margin: 36px 0 14px;
      line-height: 1.3;
    }
    .post-body h2 { font-size: 26px; }
    .post-body h3 { font-size: 20px; }
    .post-body p  { margin-bottom: 20px; }
    .post-body ul,
    .post-body ol {
      padding-left: 24px;
      margin-bottom: 20px;
    }
    .post-body li { margin-bottom: 8px; }
    .post-body blockquote {
      border-left: 4px solid var(--accent);
      margin: 28px 0;
      padding: 16px 24px;
      background: var(--light);
      border-radius: 0 4px 4px 0;
      font-style: italic;
      color: var(--text);
    }
    .post-body img {
      width: 100%;
      border-radius: 4px;
      margin: 28px 0;
      object-fit: cover;
    }
    .post-body figcaption {
      text-align: center;
      font-size: 13px;
      color: #999;
      margin-top: -20px;
      margin-bottom: 28px;
    }
    .post-body strong { color: var(--text); }
    .post-body a { color: var(--accent); text-decoration: underline; }

    .post-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.75);
      font-size: 14px;
      text-decoration: none;
      margin-bottom: 20px;
      transition: color 0.2s;
    }
    .post-back:hover { color: var(--accent); }

    .post-skeleton {
      max-width: 760px;
      margin: 0 auto;
    }
    .skeleton-line {
      background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 4px;
      height: 16px;
      margin-bottom: 14px;
    }
    .skeleton-line.wide  { width: 100%; }
    .skeleton-line.mid   { width: 70%; }
    .skeleton-line.short { width: 40%; height: 12px; }
    .skeleton-line.title { height: 36px; width: 80%; margin-bottom: 20px; }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .post-not-found {
      text-align: center;
      padding: 80px 20px;
    }
    .post-not-found h2 { color: var(--text); margin-bottom: 16px; }
    .post-not-found p  { color: var(--grey); margin-bottom: 32px; }

    /* Related posts row */
    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 28px;
    }

    @media (max-width: 600px) {
      .post-hero { height: 280px; }
    }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <!-- Hero — filled by JS -->
  <div id="post-hero-wrapper">
    <!-- Skeleton while loading -->
    <div class="page-hero" id="post-hero-skeleton">
      <div class="container">
        <div class="breadcrumb">
          <a href="index.html">Home</a><span>/</span>
          <a href="blog.html">News &amp; Tips</a><span>/</span>
          <span>Loading…</span>
        </div>
        <h1 style="color:#fff">Loading post…</h1>
      </div>
    </div>
  </div>

  <!-- Post content -->
  <section class="section">
    <div class="container">

      <!-- Skeleton loader -->
      <div class="post-skeleton" id="post-loading">
        <div class="skeleton-line short" style="margin-bottom:32px"></div>
        <div class="skeleton-line title"></div>
        <div class="skeleton-line wide"></div>
        <div class="skeleton-line wide"></div>
        <div class="skeleton-line mid"></div>
        <div class="skeleton-line wide" style="margin-top:28px"></div>
        <div class="skeleton-line wide"></div>
        <div class="skeleton-line short"></div>
      </div>

      <!-- Actual post content — hidden until loaded -->
      <div class="post-body" id="post-content" style="display:none"></div>

      <!-- Not found state -->
      <div class="post-not-found" id="post-not-found" style="display:none">
        <h2>Post Not Found</h2>
        <p>This article may have been moved or removed.</p>
        <a href="blog.html" class="btn btn-dark">← Back to News &amp; Tips</a>
      </div>

    </div>
  </section>

  <!-- Related posts -->
  <section class="section section-light" id="related-section" style="display:none">
    <div class="container">
      <div style="margin-bottom:36px">
        <div class="section-label">Keep Reading</div>
        <h2 class="section-title">More <em>Articles</em></h2>
      </div>
      <div class="related-grid" id="related-grid"></div>
    </div>
  </section>

  <section class="cta-banner" data-reveal>
    <div class="container">
      <h2>Ready to Start Your Project?</h2>
      <p>Get a free, no-obligation quote from Mikes Constructions Group Ltd today.</p>
      <div class="cta-actions">
        <a href="contact.html" class="btn btn-primary">Get a Free Quote</a>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script type="module" src="js/content.js"></script>
  <script src="js/main.js"></script>
  <script type="module" src="js/post-content.js"></script>
</body>
</html>
