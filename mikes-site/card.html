    /* ── Page wrapper — sits between navbar & footer ── */

      justify-content: center;
      padding: 100px 20px 80px; /* 100px top clears the fixed navbar */

    /* ── Card shell ── */
    .biz-card {
      width: 100%;
      max-width: 400px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(211,179,109,0.2), 0 32px 80px rgba(0,0,0,0.6);
    }

    .biz-gold-bar {
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), #f0d060, var(--accent), transparent);
    }

    /* ── Hero / logo area ── */
    .biz-hero {
      padding: 32px 24px 18px;
      text-align: center;
      background: #000;
    }
    .biz-logo {
      width: 150px;
      height: 96px;
      object-fit: contain;
      display: block;
      margin: 0 auto 18px;

    .biz-name {

      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.04em;
    }
    .biz-role {

      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 5px;
    }
    .biz-divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 14px auto;
    }
    .biz-company {
      font-family: 'Raleway', sans-serif;
      font-size: 0.72rem;
      color: #666;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* ── Contact rows ── */
    .biz-contacts {
      padding: 4px 22px 14px;
      background: #0d0d0d;
    }
    .biz-contact-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      text-decoration: none;
      color: inherit;
      transition: opacity 0.2s;
    }
    .biz-contact-item:last-child { border-bottom: none; }
    .biz-contact-item:hover { opacity: 0.8; }
    .biz-icon-wrap {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(211,179,109,0.3);
      background: rgba(211,179,109,0.06);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .biz-icon-wrap svg { width: 15px; height: 15px; fill: var(--accent); }
    .biz-contact-label {
      font-family: 'Raleway', sans-serif;
      font-size: 0.84rem;
      color: #ccc;
      word-break: break-all;
    }
    .biz-contact-sub {
      font-size: 0.68rem;
      color: #555;

    .biz-socials {
      padding: 14px 22px 18px;
      background: #0a0a0a;
      border-top: 1px solid rgba(255,255,255,0.04);

    .biz-socials-label {
      font-family: 'Raleway', sans-serif;
      font-size: 0.62rem;
      color: #555;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 12px;
    }
    .biz-social-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .biz-social-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(211,179,109,0.25);
      background: rgba(211,179,109,0.04);
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .biz-social-btn:hover { border-color: var(--accent); background: rgba(211,179,109,0.12); }
    .biz-social-btn svg { width: 16px; height: 16px; fill: var(--accent); }

    /* ── Save button — matches site .btn-primary style ── */
    .biz-save-btn {
      display: block;
      width: calc(100% - 44px);
      margin: 0 22px 22px;
      padding: 14px;
      background: var(--accent);
      border: none;

      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s, transform 0.15s;
